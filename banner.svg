<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#0a182c" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="12%" cy="25%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="88%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="72%" cy="18%" r="38%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="85%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#a78bfa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#253041" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .badge-text { font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 2px; }
    .name-text { font-size: 46px; font-weight: 800; fill: url(#titleGradient); letter-spacing: -0.5px; }
    .sub-text { font-size: 19px; font-weight: 500; fill: #e2e8f0; letter-spacing: 0.2px; }
    .desc-text { font-size: 14px; fill: #94a3b8; }
    .tag-box { fill: #111827; stroke: #334155; stroke-width: 1; rx: 6; }
    .tag-text { font-size: 12px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.2" />

  <!-- Ambient Glows -->
  <rect width="1200" height="320" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#emeraldGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#violetGlow)" />

  <!-- Grid overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Decorative Wave / Network Graph Accents (Right side) -->
  <g opacity="0.6" transform="translate(760, 35)">
    <!-- Data curve lines -->
    <path d="M 0 170 Q 70 30 130 115 T 250 75 T 380 135" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" />
    <path d="M 0 190 Q 80 70 150 155 T 290 105 T 400 85" fill="none" stroke="#34d399" stroke-width="2" />
    <path d="M 20 215 Q 110 135 190 195 T 320 125 T 410 165" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.75" />

    <!-- Graph Nodes -->
    <circle cx="70" cy="30" r="5" fill="#38bdf8" />
    <circle cx="70" cy="30" r="11" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    
    <circle cx="130" cy="115" r="4.5" fill="#34d399" />
    <circle cx="250" cy="75" r="6" fill="#10b981" />
    <circle cx="250" cy="75" r="13" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />

    <circle cx="290" cy="105" r="5" fill="#a78bfa" />
    <circle cx="290" cy="105" r="10" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" />

    <circle cx="380" cy="135" r="5.5" fill="#38bdf8" />
    <circle cx="400" cy="85" r="4" fill="#34d399" />

    <!-- Connecting network lines -->
    <line x1="70" y1="30" x2="130" y2="115" stroke="#334155" stroke-width="1" />
    <line x1="130" y1="115" x2="250" y2="75" stroke="#334155" stroke-width="1" />
    <line x1="250" y1="75" x2="290" y2="105" stroke="#334155" stroke-width="1" />
    <line x1="290" y1="105" x2="380" y2="135" stroke="#334155" stroke-width="1" />
    <line x1="250" y1="75" x2="400" y2="85" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 48)">
    <!-- Terminal Category Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="url(#badgeGradient)" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#34d399" />
    <text x="26" y="19" class="mono badge-text">COMPUTER SCIENCE &amp; DATA SCIENCE</text>

    <!-- Main Title -->
    <text x="0" y="78" class="sans name-text">Falah Kulsum</text>

    <!-- Subtitle / Track -->
    <text x="0" y="114" class="sans sub-text">Data Science &#183; Machine Learning &#183; Systems &amp; Software Engineering</text>

    <!-- Micro Description -->
    <text x="0" y="142" class="sans desc-text">Building intelligent predictive models, data-driven pipelines &amp; robust scalable software.</text>

    <!-- Gradient Divider Line -->
    <line x1="0" y1="168" x2="680" y2="168" stroke="url(#lineGrad)" stroke-width="2" />

    <!-- Skill Tags -->
    <g transform="translate(0, 186)">
      <!-- Tag 1: Python -->
      <g transform="translate(0, 0)">
        <rect width="90" height="30" class="tag-box" />
        <text x="45" y="20" class="mono tag-text" text-anchor="middle">Python</text>
      </g>

      <!-- Tag 2: Machine Learning -->
      <g transform="translate(100, 0)">
        <rect width="150" height="30" class="tag-box" />
        <text x="75" y="20" class="mono tag-text" text-anchor="middle">Machine Learning</text>
      </g>

      <!-- Tag 3: SQL & Analytics -->
      <g transform="translate(260, 0)">
        <rect width="140" height="30" class="tag-box" />
        <text x="70" y="20" class="mono tag-text" text-anchor="middle">SQL &amp; Analytics</text>
      </g>

      <!-- Tag 4: Data Engineering -->
      <g transform="translate(410, 0)">
        <rect width="145" height="30" class="tag-box" />
        <text x="72.5" y="20" class="mono tag-text" text-anchor="middle">Data Pipelines</text>
      </g>

      <!-- Tag 5: C / DSA -->
      <g transform="translate(565, 0)">
        <rect width="115" height="30" class="tag-box" />
        <text x="57.5" y="20" class="mono tag-text" text-anchor="middle">C &amp; DSA</text>
      </g>
    </g>
  </g>
</svg>
